<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="audibleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="audibleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Liquid Glass Outer Ring -->
  <circle cx="50" cy="50" r="44" stroke="url(#audibleGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 6"/>
  
  <!-- Dynamic Acoustic Waveform Core -->
  <g filter="url(#audibleGlow)" stroke="url(#audibleGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="26" y1="42" x2="26" y2="58" opacity="0.75" />
    <line x1="38" y1="32" x2="38" y2="68" opacity="0.9" />
    <line x1="50" y1="20" x2="50" y2="80" opacity="1.0" />
    <line x1="62" y1="32" x2="62" y2="68" opacity="0.9" />
    <line x1="74" y1="42" x2="74" y2="58" opacity="0.75" />
  </g>
</svg>
